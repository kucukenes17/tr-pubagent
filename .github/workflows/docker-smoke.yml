name: Docker smoke

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  clean-environment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production containers
        run: docker compose build

      - name: Start stack
        run: docker compose up --detach

      - name: Verify API and dashboard
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Docker smoke passed on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
