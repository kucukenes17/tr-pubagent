services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      TR_PUBAGENT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      TR_PUBAGENT_DB: /data/tr_pubagent.db
    volumes:
      - tr_pubagent_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tr_pubagent_data:
